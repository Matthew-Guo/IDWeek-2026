<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#343741">
<title>IDWeek Congress Planner &mdash; Shift Health</title>
<style>
:root{
  --brand-dark:#343741;      /* logo cls-1 */
  --brand-teal:#20aa97;      /* logo cls-2 */
  --teal-deep:#0B5F53;
  --teal-tint:#E6F6F3;
  --ink:#343741;
  --muted:#5C626E;
  --line:#D9DCE1;
  --bg:#FFFFFF;
  --panel:#F6F7F8;
  --lw:130px;
  --ind-box:#1F2128;
  --ind-gold:#F2C14E;
  --warn-fill:#FDF0DC;       /* concurrency only */
  --warn-line:#E0A458;
  --warn-ink:#8A4B00;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1280px;margin:0 auto;padding:0 14px 64px}

/* ---------- header ---------- */
header.hd{display:flex;align-items:center;gap:16px;padding:18px 0 14px;border-bottom:3px solid var(--brand-dark)}
.logo{width:132px;flex:0 0 132px}
.logo svg{display:block;width:100%;height:auto}
.hd h1{margin:0;font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.hd .sub{margin:3px 0 0;font-size:12.5px;color:var(--muted);font-weight:500}

/* ---------- filters ---------- */
.filters{position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:2px solid var(--brand-teal);padding:10px 0 9px;margin-bottom:6px}
.frow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:7px}
.frow:last-child{margin-bottom:0}
.flab{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--brand-teal);margin-right:3px}
button.chip,select.chip,input.chip{font:inherit;font-size:13px;background:#fff;color:var(--ink);
  border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;
  min-height:38px;-webkit-appearance:none;appearance:none}
select.chip{border-radius:8px;padding-right:28px;
  background-image:linear-gradient(45deg,transparent 50%,var(--brand-dark) 50%),linear-gradient(135deg,var(--brand-dark) 50%,transparent 50%);
  background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
input.chip{border-radius:8px;cursor:text;min-width:190px;flex:1 1 190px;max-width:360px}
button.chip:hover{border-color:var(--brand-teal)}
button.chip[aria-pressed="true"]{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff;font-weight:600}
button.chip.tgl[aria-pressed="true"]{background:var(--teal-deep);border-color:var(--teal-deep)}
.sh{display:none}
.count{font-size:13px;font-weight:600;color:var(--muted);margin-left:auto;white-space:nowrap}
.count b{color:var(--brand-dark);font-size:15px}
.catwrap{position:relative;display:inline-block}
.catmenu{position:absolute;top:calc(100% + 5px);left:0;z-index:60;background:#fff;
  border:1.5px solid var(--brand-dark);border-radius:10px;padding:8px;
  width:min(330px,calc(100vw - 28px));max-height:52vh;overflow-y:auto;
  box-shadow:0 8px 24px rgba(52,55,65,.18)}
.catmenu[hidden]{display:none}
.catacts{display:flex;gap:6px;padding:0 2px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.catacts button{font:inherit;font-size:12px;font-weight:600;background:#fff;color:var(--teal-deep);
  border:1.5px solid var(--brand-teal);border-radius:999px;padding:5px 11px;cursor:pointer;min-height:32px}
.catmenu label{display:flex;align-items:center;gap:9px;padding:8px 6px;border-radius:6px;
  font-size:13.5px;cursor:pointer;line-height:1.25;min-height:40px}
.catmenu label:hover{background:var(--teal-tint)}
.catmenu input{width:18px;height:18px;flex:0 0 18px;accent-color:var(--teal-deep);margin:0}
.catmenu .cn{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);padding-left:8px}
.catmenu .ct{overflow-wrap:anywhere}
button.chip#f-cat-btn[aria-pressed="true"]{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.jump{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.jump a{font-size:12.5px;color:var(--teal-deep);text-decoration:none;border-bottom:1.5px solid var(--brand-teal);padding-bottom:1px}

/* ---------- coverage panel ---------- */
details.panel{border:1.5px solid var(--line);border-left:5px solid var(--brand-teal);
  border-radius:10px;margin:14px 0 8px;background:var(--panel);overflow:hidden}
details.panel > summary{list-style:none;cursor:pointer;padding:11px 15px;min-height:44px;
  display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--brand-teal)}
details.panel > summary::-webkit-details-marker{display:none}
details.panel > summary::before{content:"\25B8";font-size:12px;transition:transform .15s}
details.panel[open] > summary::before{transform:rotate(90deg)}
details.panel > summary .sm{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);font-size:12px}
.pbody{padding:0 16px 14px}
.panel h3{margin:13px 0 5px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--brand-dark)}
.pbody h3:first-child{margin-top:0}
.panel ul{margin:0;padding-left:17px}
.panel li{margin:0 0 5px;font-size:13.5px;overflow-wrap:anywhere}
.panel .cost{font-weight:700;color:var(--warn-ink);white-space:nowrap}
.panel .none{color:var(--muted);font-size:13.5px;margin:0}

/* ---------- day ---------- */
.day{margin-top:26px;scroll-margin-top:150px}
.day > h2{margin:0 0 10px;padding-bottom:7px;font-size:17px;font-weight:700;
  border-bottom:2px solid var(--brand-dark);color:var(--brand-dark)}

/* ---------- timeline (desktop lanes) ---------- */
.tl{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin-bottom:16px;background:#fff}
.axis{position:relative;height:17px;margin-left:var(--lw);border-bottom:1px solid var(--line)}
.axis span{position:absolute;top:0;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.lane{display:flex;align-items:stretch;border-bottom:1px solid #EEF0F2;min-height:30px}
.lane:last-child{border-bottom:0}
.lname{flex:0 0 var(--lw);width:var(--lw);padding:7px 9px 7px 0;font-size:11.5px;font-weight:600;
  color:var(--teal-deep);line-height:1.2;overflow-wrap:anywhere}
.track{position:relative;flex:1 1 auto;min-width:0}
.blk{position:absolute;top:5px;bottom:5px;border-radius:4px;font-size:10.5px;line-height:1.15;
  padding:3px 4px;overflow:hidden;cursor:pointer;min-width:3px}
.blk.hi{background:var(--brand-dark);color:#fff;border:1.5px solid var(--brand-dark)}
.blk.me{background:#fff;color:var(--brand-dark);border:1.5px solid var(--brand-dark)}
.blk.po{background:#fff;color:var(--brand-dark);border:1.5px dashed var(--brand-dark)}
.blk:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
.rail{position:absolute;bottom:0;height:3px;background:var(--brand-teal);opacity:.55}
.tick{position:absolute;bottom:0;width:1px;height:9px;background:var(--brand-dark)}
.band{position:absolute;top:0;bottom:0;background:var(--warn-fill);border-left:1px solid var(--warn-line);
  border-right:1px solid var(--warn-line);z-index:0;pointer-events:none}
.lanes{position:relative}
.lane{position:relative;z-index:1}
.bandlayer{position:absolute;left:var(--lw);right:0;top:0;bottom:0;z-index:0;pointer-events:none}
.cap{margin-top:9px;padding:9px 11px;border:1.5px solid var(--brand-teal);border-radius:8px;
  font-size:12.5px;background:var(--teal-tint);color:var(--brand-dark)}
.cap:empty{display:none}

/* ---------- ribbon (mobile) ---------- */
.ribbon{display:none}

/* ---------- list ---------- */
.slot{margin:16px 0 0}
.slot > h3{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--brand-dark);
  border-left:4px solid var(--brand-teal);padding-left:9px}
details.notebox{margin:0 0 8px 13px;border:1px solid var(--warn-line);border-radius:6px;
  background:var(--warn-fill);color:var(--warn-ink);font-size:12.5px;overflow:hidden}
details.notebox > summary{list-style:none;cursor:pointer;padding:6px 10px;font-weight:700;
  display:flex;align-items:center;gap:7px;min-height:32px}
details.notebox > summary::-webkit-details-marker{display:none}
details.notebox > summary::before{content:"\25B8";font-size:11px;transition:transform .15s}
details.notebox[open] > summary::before{transform:rotate(90deg)}
details.notebox ul{margin:0;padding:0 12px 9px 30px}
details.notebox li{margin:0 0 4px;font-weight:500;overflow-wrap:anywhere}
.sess{margin:0 0 12px 13px;border-left:1.5px solid var(--line);padding-left:11px}
.shd{margin-bottom:6px}
.smeta{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-teal)}
.stitle{font-size:14px;font-weight:700;margin-top:1px;overflow-wrap:anywhere}
.sroom{font-size:12px;color:var(--muted);margin-top:1px}
.item{border-radius:6px;padding:9px 11px;margin-bottom:6px;font-size:13.5px}
.item.hi{background:var(--brand-dark);color:#fff}
.item.me{background:#fff;color:var(--brand-dark);border:1.5px solid var(--brand-dark)}
.item .ttl{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item .l1{overflow-wrap:anywhere;font-size:11.5px;font-weight:700;letter-spacing:.04em;margin-bottom:2px;opacity:.85}
.item .l2{font-size:12px;margin-top:4px;line-height:1.35;opacity:.92;overflow-wrap:anywhere}
.item.hi .l2{color:#E8EAED}
.item.me .l2{color:var(--muted)}
.ind{display:inline-block;background:var(--ind-box);color:var(--ind-gold);
  border:1px solid rgba(242,193,78,.45);border-radius:4px;padding:1px 6px;
  font-weight:700;letter-spacing:.01em;overflow-wrap:anywhere}
.item.hi .l2 .ind{color:var(--ind-gold)}
/* ---------- annotations ---------- */
details.ann{margin-top:7px;border-top:1px solid rgba(255,255,255,.22);padding-top:6px}
.item.me details.ann{border-top-color:var(--line)}
details.ann > summary{list-style:none;cursor:pointer;font-size:11.5px;font-weight:700;
  letter-spacing:.03em;display:flex;align-items:center;gap:6px;min-height:28px;opacity:.9}
details.ann > summary::-webkit-details-marker{display:none}
details.ann > summary::before{content:"\25B8";font-size:10px;transition:transform .15s}
details.ann[open] > summary::before{transform:rotate(90deg)}
.owner{display:inline-block;background:var(--brand-teal);color:#08302A;border-radius:4px;
  padding:1px 7px;font-weight:700;font-size:11px;overflow-wrap:anywhere}
.notemark{font-weight:600;opacity:.85}
.annbody{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.ann-o,.ann-n{font:inherit;font-size:13px;background:#fff;color:var(--ink);
  border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px}
.ann-o{flex:0 0 auto;max-width:100%;-webkit-appearance:none;appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--brand-dark) 50%),linear-gradient(135deg,var(--brand-dark) 50%,transparent 50%);
  background-position:calc(100% - 14px) 18px,calc(100% - 9px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.ann-n{flex:1 1 220px;min-width:0;resize:vertical;line-height:1.35}
.annprint{display:none}
.covrow{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.syncst{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.syncst:empty{display:none}
#f-cov{min-width:170px}
.warnbar{margin:10px 0 0;padding:8px 11px;border:1.5px solid var(--warn-line);border-radius:8px;
  background:var(--warn-fill);color:var(--warn-ink);font-size:12.5px;font-weight:600}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- mobile ---------- */
@media (max-width:760px){
  body{font-size:15px}
  .wrap{padding:0 11px 56px}
  header.hd{gap:12px;padding:14px 0 11px}
  .logo{width:104px;flex:0 0 104px}
  .hd h1{font-size:16px}
  .filters{padding:9px 0 8px}
  .frow{gap:6px}
  button.chip,select.chip,input.chip{font-size:13.5px;min-height:40px;padding:8px 12px}
  .catwrap{flex:1 1 150px;min-width:140px}
  .catwrap>button.chip{width:100%;text-align:left}
  input.chip{flex:1 1 100%;max-width:none}
  .count{margin-left:auto;font-size:12.5px}
  .filters{padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .jump{display:none!important}
  .flab{font-size:10px;margin-right:1px}
  .lg{display:none}
  .sh{display:inline}
  .tl{display:none}
  .ribbon{display:block;border:1.5px solid var(--line);border-radius:10px;
    padding:9px 11px 11px;margin-bottom:14px;background:#fff}
  .rbaxis{position:relative;height:15px;border-bottom:1px solid var(--line);margin-bottom:5px}
  .rbaxis span{position:absolute;top:0;font-size:10px;color:var(--muted);transform:translateX(-50%)}
  .rbbands{position:relative;height:13px}
  .rbtrack{position:relative;height:40px;margin-top:2px}
  .rbseg{position:absolute;top:0;bottom:0;border-radius:4px;cursor:pointer;min-width:4px}
  .rbseg.hi{background:var(--brand-dark);border:1.5px solid var(--brand-dark)}
  .rbseg.me{background:#fff;border:1.5px solid var(--brand-dark)}
  .rbseg.po{background:repeating-linear-gradient(45deg,#fff,#fff 3px,#C7CBD1 3px,#C7CBD1 5px);
    border:1.5px dashed var(--brand-dark)}
  .rbseg:focus{outline:2px solid var(--brand-teal);outline-offset:1px}
  .rblab{font-size:10.5px;color:var(--muted);margin-top:5px}
  .sess{margin-left:0;padding-left:9px}
  .ann-o{flex:1 1 100%}
  .ann-n{flex:1 1 100%}
  details.notebox{margin-left:0}
  .day > h2{font-size:16px}
  .item{padding:10px 12px}
}
@media (max-width:420px){
  .logo{width:88px;flex:0 0 88px}
  .hd h1{font-size:15px}
}

/* ---------- print ---------- */
@media print{
  @page{margin:12mm}
  body{font-size:10pt}
  .filters,.jump{display:none!important}
  .ribbon{display:none!important}
  .tl{display:block!important;page-break-inside:avoid}
  .wrap{max-width:none;padding:0}
  .day{page-break-before:auto}
  .sess,.item,details.panel{page-break-inside:avoid}
  details.panel[open]>.pbody,details.notebox[open]{display:block}
  .blk.hi,.item.hi{background:var(--brand-dark)!important;color:#fff!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .blk.me,.item.me{border-color:var(--brand-dark)!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  details.ann>summary,.annbody{display:none!important}
  details.ann{border-top:1px solid var(--line)}
  .annprint{display:block!important;font-size:9pt;margin-top:4px}
  .band,details.notebox,.ind{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .logo svg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{text-decoration:none;color:inherit}
}
</style>

</head>

<script>
(function(){
"use strict";
var D = window.__DATA__, IT = {}, i, j;
for(i=0;i<D.items.length;i++) IT[D.items[i].id]=D.items[i];
var DAYLAB={'20-Oct':'Mon 20 Oct','21-Oct':'Tue 21 Oct','22-Oct':'Wed 22 Oct','23-Oct':'Thu 23 Oct','24-Oct':'Fri 24 Oct'};
function hhmm(m){return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var S={day:'all',prio:'all',cats:{},ncat:0,ind:false,conc:false,cov:'all',q:''};

/* ---------------- annotation store ---------------- */
/* ---- SHARED SAVING ----------------------------------------------------
   Already pointed at your Cloudflare Worker. Nothing to edit.
   Emptying the quotes would make the planner save on each device only. */
var SYNC_URL='https://idweek-coverage.mguo-044.workers.dev/api/coverage';

var TEAM=(D.team&&D.team.length)?D.team.slice():['Hemal','Matthew','Fatemeh','Zoya','Brendan','ChrisO','Yi','ChrisD'];
var SKEY='shifthealth.idweek.planner.v1', ST={v:1,people:TEAM.slice(),ann:{}}, STOK=true;
var SYNCST='', PKEY='shifthealth.idweek.pending.v1', PEND={}, TIMERS={};
try{var _p=window.localStorage.getItem(PKEY); if(_p) PEND=JSON.parse(_p)||{};}catch(e){}
function keyOf(it){return it.date+'|'+it.aid;}
function loadStore(){
  try{var raw=window.localStorage.getItem(SKEY);
    if(raw){var p=JSON.parse(raw);
      if(p&&typeof p==='object'){
        ST.people=TEAM.slice();
        if(Array.isArray(p.people)) for(var q=0;q<p.people.length;q++)
          if(ST.people.indexOf(p.people[q])<0) ST.people.push(p.people[q]);
        ST.ann=(p.ann&&typeof p.ann==='object')?p.ann:{};}}
  }catch(e){STOK=false;}
}
function saveStore(){
  try{window.localStorage.setItem(SKEY,JSON.stringify(ST));}catch(e){STOK=false;showStoreWarn();}
}
function showStoreWarn(){
  if(document.getElementById('swarn')) return;
  var d=document.createElement('div');d.className='warnbar';d.id='swarn';
  d.textContent='This browser is not saving coverage and notes. Use Export to keep your work.';
  var p=document.getElementById('panel');p.parentNode.insertBefore(d,p);
}
function annOf(it){return ST.ann[keyOf(it)]||null;}
function effOwner(it){var a=ST.ann[keyOf(it)];return (a&&a.o)||'';}
function effNote(it){var a=ST.ann[keyOf(it)];return (a&&a.n)||'';}
function setAnn(k,field,val){
  var a=ST.ann[k]||{};
  if(val) a[field]=val; else delete a[field];
  if(a.o||a.n) ST.ann[k]=a; else delete ST.ann[k];
  saveStore(); pushItem(k);
}

/* ---------------- shared sync (only when SYNC_URL is set) ---------------- */
function setSync(msg){SYNCST=msg;var e=document.getElementById('syncst');if(e)e.textContent=msg;}
function savePending(){try{window.localStorage.setItem(PKEY,JSON.stringify(PEND));}catch(e){}}
function pendCount(){var n=0,k;for(k in PEND)n++;return n;}
function syncMsg(){
  var n=pendCount();
  setSync(n?('Not saved yet \u2014 '+n+' change'+(n===1?'':'s')+' pending'):'Saved for everyone');
}
function busy(){
  var a=document.activeElement;
  return !!(a&&a.classList&&(a.classList.contains('ann-n')||a.classList.contains('ann-o')));
}
/* one request per item, so two people editing different sessions never collide */
function pushItem(k){
  if(!SYNC_URL) return;
  var a=ST.ann[k]||{};
  PEND[k]={o:a.o||'',n:a.n||''};
  savePending(); setSync('Saving\u2026');
  if(TIMERS[k]) clearTimeout(TIMERS[k]);
  TIMERS[k]=setTimeout(function(){flushOne(k);},800);
}
function flushOne(k){
  var body=PEND[k]; if(!body||!SYNC_URL) return;
  fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
                  body:JSON.stringify({k:k,o:body.o,n:body.n})})
    .then(function(r){if(!r.ok)throw 0; delete PEND[k]; savePending(); syncMsg();})
    .catch(function(){syncMsg();});
}
function flushAll(){for(var k in PEND) flushOne(k);}
function pullRemote(first){
  if(!SYNC_URL) return;
  fetch(SYNC_URL,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(p){
    if(!p||typeof p!=='object'||!p.ann) return;
    if(busy()) return;
    var merged={},k,e,a;
    for(k in p.ann){e=p.ann[k];a={};if(e&&e.o)a.o=e.o;if(e&&e.n)a.n=e.n;if(a.o||a.n)merged[k]=a;}
    for(k in PEND){a={};if(PEND[k].o)a.o=PEND[k].o;if(PEND[k].n)a.n=PEND[k].n;
      if(a.o||a.n) merged[k]=a; else delete merged[k];}
    if(JSON.stringify(merged)===JSON.stringify(ST.ann)&&!first){syncMsg();return;}
    ST.ann=merged;
    for(k in ST.ann){var ow=ST.ann[k].o; if(ow&&ST.people.indexOf(ow)<0) ST.people.push(ow);}
    saveStore(); syncMsg(); renderCovRow(); render();
  }).catch(function(){setSync('Offline \u2014 working from this device');});
}

/* ---------------- filtering ---------------- */
function base(){
  var q=S.q.trim().toLowerCase(), out=[];
  for(var k=0;k<D.items.length;k++){
    var it=D.items[k];
    if(S.day!=='all' && it.date!==S.day) continue;
    if(S.prio!=='all' && it.prio!==S.prio) continue;
    if(S.ncat>0 && !S.cats[it.cat]) continue;
    if(S.ind && !it.isIndustry) continue;
    if(S.cov!=='all'){
      var _o=effOwner(it);
      if(S.cov==='__none'){ if(_o) continue; }
      else if(_o!==S.cov) continue;
    }
    if(q){
      var hay=(it.title+' '+it.author+' '+it.stitle+' '+it.aid+' '+it.affil).toLowerCase();
      if(hay.indexOf(q)<0) continue;
    }
    out.push(it);
  }
  return out;
}

/* ---------------- computed notes (live, from visible set) ---------------- */
function computeBands(list){
  var byDay={},k;
  for(k=0;k<list.length;k++){ if(list[k].isVirtual) continue;
    (byDay[list[k].date]=byDay[list[k].date]||[]).push(list[k]); }
  var res={};
  for(var d in byDay){
    var day=byDay[d], pts={}, p=[];
    for(k=0;k<day.length;k++){pts[day[k].commitStart]=1;pts[day[k].commitEnd]=1;}
    for(var t in pts) p.push(+t); p.sort(function(a,b){return a-b;});
    var raw=[];
    for(k=0;k<p.length-1;k++){
      var a=p[k],b=p[k+1],seen={},rooms=[];
      for(j=0;j<day.length;j++) if(day[j].commitStart<b&&day[j].commitEnd>a){
        var L=laneOf(day[j]); if(!seen[L]){seen[L]=1;rooms.push(L);} }
      if(rooms.length>=2){rooms.sort();raw.push({a:a,b:b,rooms:rooms});}
    }
    var mg=[];
    for(k=0;k<raw.length;k++){
      var last=mg[mg.length-1];
      if(last && last.b===raw[k].a && last.rooms.join('|')===raw[k].rooms.join('|')) last.b=raw[k].b;
      else mg.push({a:raw[k].a,b:raw[k].b,rooms:raw[k].rooms.slice()});
    }
    for(k=0;k<mg.length;k++){
      var bd=mg[k]; bd.detail=[];
      for(var r=0;r<bd.rooms.length;r++){
        var n=0,h=0;
        for(j=0;j<day.length;j++) if(laneOf(day[j])===bd.rooms[r]&&day[j].commitStart<bd.b&&day[j].commitEnd>bd.a){
          n++; if(day[j].prio==='High') h++; }
        bd.detail.push({room:bd.rooms[r],n:n,high:h});
      }
    }
    res[d]=mg;
  }
  return res;
}
function computeSqueeze(list){
  var byDay={},k;
  for(k=0;k<list.length;k++){ if(list[k].isVirtual) continue;
    (byDay[list[k].date]=byDay[list[k].date]||[]).push(list[k]); }
  var out=[];
  for(var d in byDay){
    var day=byDay[d],pw=[],timed=[];
    for(k=0;k<day.length;k++) (day[k].isPoster?pw:timed).push(day[k]);
    if(!pw.length) continue;
    var ws=pw[0].winStart,we=pw[0].winEnd,ov=[];
    for(k=0;k<timed.length;k++){
      var s=Math.max(ws,timed[k].commitStart),e=Math.min(we,timed[k].commitEnd);
      if(e>s) ov.push([s,e]);
    }
    ov.sort(function(a,b){return a[0]-b[0];});
    var mg=[];
    for(k=0;k<ov.length;k++){
      if(mg.length&&ov[k][0]<=mg[mg.length-1][1]) mg[mg.length-1][1]=Math.max(mg[mg.length-1][1],ov[k][1]);
      else mg.push([ov[k][0],ov[k][1]]);
    }
    var lost=0; for(k=0;k<mg.length;k++) lost+=mg[k][1]-mg[k][0];
    var surv=(we-ws)-lost;
    out.push({date:d,ws:ws,we:we,total:we-ws,lost:lost,surv:surv,boards:pw.length,
              per:pw.length?surv/pw.length:0});
  }
  out.sort(function(a,b){return D.dates.indexOf(a.date)-D.dates.indexOf(b.date);});
  return out;
}
function computeTight(list){
  var byDay={},k;
  for(k=0;k<list.length;k++){ if(list[k].isVirtual) continue;
    (byDay[list[k].date]=byDay[list[k].date]||[]).push(list[k]); }
  var out=[];
  for(var d in byDay){
    var day=byDay[d];
    for(k=0;k<day.length;k++) for(j=0;j<day.length;j++){
      if(laneOf(day[k])===laneOf(day[j])) continue;
      var gap=day[j].commitStart-day[k].commitEnd;
      if(gap>=0&&gap<10) out.push({date:d,from:day[k],to:day[j],gap:gap});
    }
  }
  out.sort(function(a,b){return (D.dates.indexOf(a.date)-D.dates.indexOf(b.date))||(a.from.commitEnd-b.from.commitEnd);});
  return out;
}

/* ---------------- render: coverage panel ---------------- */
function renderPanel(bands,sq,tight){
  var h='',k,r,any=false,nb=0;
  for(var dz in bands) nb+=bands[dz].length;
  var rows=[];
  for(var d in bands) for(k=0;k<bands[d].length;k++){
    var bd=bands[d][k],parts=[];
    for(r=0;r<bd.detail.length;r++)
      parts.push(esc(bd.detail[r].room)+' ('+bd.detail[r].n+' item'+(bd.detail[r].n===1?'':'s')+', '+bd.detail[r].high+' high)');
    rows.push({d:d,a:bd.a,html:'<b>'+esc(DAYLAB[d]||d)+' '+hhmm(bd.a)+'–'+hhmm(bd.b)+'</b> — '+parts.join(' · ')+
      ' <span class="cost">'+(bd.b-bd.a)+' min</span>'});
  }
  rows.sort(function(a,b){return (D.dates.indexOf(a.d)-D.dates.indexOf(b.d))||(a.a-b.a);});
  h+='<h3>Concurrent — split between people</h3>';
  if(rows.length){any=true;h+='<ul>';for(k=0;k<rows.length;k++)h+='<li>'+rows[k].html+'</li>';h+='</ul>';}
  else h+='<p class="none">Nothing running concurrently in the current view.</p>';

  h+='<h3>Squeezed poster window</h3>';
  if(sq.length){any=true;h+='<ul>';
    for(k=0;k<sq.length;k++){var s=sq[k];
      h+='<li><b>'+esc(DAYLAB[s.date]||s.date)+' '+hhmm(s.ws)+'–'+hhmm(s.we)+'</b> — '+
        s.surv+' of '+s.total+' board minutes survive across '+s.boards+' board'+(s.boards===1?'':'s')+
        ' = <b>'+s.per.toFixed(1)+' min per board</b> <span class="cost">'+s.lost+' min lost</span></li>';}
    h+='</ul>';}
  else h+='<p class="none">No poster window in the current view.</p>';

  h+='<h3>Allocation</h3>';
  var alloc={},unass=0,unassH=0,vis=arguments[3]||[];
  for(k=0;k<vis.length;k++){
    var ov=effOwner(vis[k]);
    if(!ov){unass++; if(vis[k].prio==='High') unassH++; continue;}
    if(!alloc[ov]) alloc[ov]={n:0,hi:0};
    alloc[ov].n++; if(vis[k].prio==='High') alloc[ov].hi++;
  }
  var pl=[];for(var pn in alloc) pl.push(pn);
  pl.sort(function(a,b){return alloc[b].n-alloc[a].n||a.localeCompare(b);});
  h+='<ul>';
  for(k=0;k<pl.length;k++)
    h+='<li><b>'+esc(pl[k])+'</b> — '+alloc[pl[k]].n+' item'+(alloc[pl[k]].n===1?'':'s')+
       ', '+alloc[pl[k]].hi+' high</li>';
  h+='<li><b>Unassigned</b> — '+unass+' item'+(unass===1?'':'s')+', '+unassH+' high</li></ul>';

  h+='<h3>Tight transitions (under 10 min)</h3>';
  if(tight.length){any=true;h+='<ul>';
    for(k=0;k<tight.length;k++){var t=tight[k];
      h+='<li><b>'+esc(DAYLAB[t.date]||t.date)+'</b> — '+esc(t.from.aid)+' ('+esc(laneOf(t.from))+
        ') ends '+hhmm(t.from.commitEnd)+' → '+esc(t.to.aid)+' ('+esc(laneOf(t.to))+') starts '+
        hhmm(t.to.commitStart)+' <span class="cost">'+t.gap+' min</span></li>';}
    h+='</ul>';}
  else h+='<p class="none">No transition under 10 minutes in the current view.</p>';
  var bits=[nb+' concurrent', sq.length+' poster squeeze'+(sq.length===1?'':'s'),
            tight.length+' tight transition'+(tight.length===1?'':'s')];
  var pel=document.getElementById('panel'), wasOpen=pel.open;
  pel.innerHTML='<summary>Coverage &amp; splits <span class="sm">&mdash; '+bits.join(' &middot; ')+
                '</span></summary><div class="pbody">'+h+'</div>';
  pel.open=wasOpen;
  return any;
}

/* ---------------- render: timelines ---------------- */
function dayRange(day){
  var lo=1e9,hi=-1e9;
  for(var k=0;k<day.length;k++){lo=Math.min(lo,day[k].commitStart);hi=Math.max(hi,day[k].commitEnd);}
  lo=Math.floor(lo/60)*60; hi=Math.ceil(hi/60)*60;
  if(hi-lo<60) hi=lo+60;
  return [lo,hi];
}
function axisHTML(lo,hi){
  var h='';
  for(var t=lo;t<=hi;t+=60) h+='<span style="left:'+(((t-lo)/(hi-lo))*100).toFixed(3)+'%">'+hhmm(t)+'</span>';
  return h;
}
function laneTimeline(date,day,bands){
  var lo=dayRange(day),hi=lo[1];lo=lo[0];var span=hi-lo,k,j;
  function pc(a,b){return {l:((a-lo)/span*100).toFixed(3),w:(Math.max(b-a,1)/span*100).toFixed(3)};}
  var lanes={},order=[];
  for(k=0;k<day.length;k++){var L=laneOf(day[k]); if(!lanes[L]){lanes[L]=[];order.push(L);} lanes[L].push(day[k]);}
  order.sort(function(a,b){
    var ra=a==='Poster halls'?1:(a==='Virtual posters'?2:0), rb=b==='Poster halls'?1:(b==='Virtual posters'?2:0);
    return ra-rb || a.localeCompare(b,undefined,{numeric:true});});
  var h='<div class="tl"><div class="axis">'+axisHTML(lo,hi)+'</div>';
  h+='<div class="lanes"><div class="bandlayer">';
  for(k=0;k<bands.length;k++){var g2=pc(bands[k].a,bands[k].b);
    h+='<div class="band" style="left:'+g2.l+'%;width:'+g2.w+'%"></div>';}
  h+='</div>';
  for(var o=0;o<order.length;o++){
    var L=order[o],list=lanes[L];
    h+='<div class="lane"><div class="lname">'+esc(L)+'</div><div class="track">';
    var bySess={};
    for(k=0;k<list.length;k++){
      var it=list[k],g3=pc(it.commitStart,it.commitEnd);
      var cls=it.isPoster?'po':pcls(it.prio);
      h+='<button class="blk '+cls+'" data-id="'+it.id+'" style="left:'+g3.l+'%;width:'+g3.w+'%" '+
         'title="'+esc(it.aid+' · '+it.title)+'">'+esc(it.aid)+'</button>';
      if(!it.isPoster) (bySess[it.date+'|'+it.sid]=bySess[it.date+'|'+it.sid]||[]).push(it);
    }
    for(var sk in bySess){
      var segs=bySess[sk]; if(segs.length<2) continue;
      segs.sort(function(a,b){return a.commitStart-b.commitStart;});
      var a0=segs[0].commitStart,b0=segs[segs.length-1].commitEnd,g4=pc(a0,b0);
      h+='<div class="rail" style="left:'+g4.l+'%;width:'+g4.w+'%"></div>';
      for(j=1;j<segs.length;j++){var g5=pc(segs[j].commitStart,segs[j].commitStart);
        h+='<div class="tick" style="left:'+g5.l+'%"></div>';}
    }
    h+='</div></div>';
  }
  h+='</div><div class="cap" id="cap-'+date+'"></div></div>';
  return h;
}
function ribbon(date,day,bands){
  var r=dayRange(day),lo=r[0],hi=r[1],span=hi-lo,k,j;
  function pc(a,b){return {l:((a-lo)/span*100).toFixed(3),w:(Math.max(b-a,1)/span*100).toFixed(3)};}
  var pts={};
  for(k=0;k<day.length;k++){pts[day[k].commitStart]=1;pts[day[k].commitEnd]=1;}
  var p=[];for(var t in pts)p.push(+t);p.sort(function(a,b){return a-b;});
  var h='<div class="ribbon"><div class="rbaxis">'+axisHTML(lo,hi)+'</div><div class="rbbands">';
  for(k=0;k<bands.length;k++){var gb=pc(bands[k].a,bands[k].b);
    h+='<div class="band" style="left:'+gb.l+'%;width:'+gb.w+'%"></div>';}
  h+='</div><div class="rbtrack">';
  for(k=0;k<p.length-1;k++){
    var a=p[k],b=p[k+1],ids=[],hasHigh=false,hasTimed=false;
    for(j=0;j<day.length;j++) if(day[j].commitStart<b&&day[j].commitEnd>a){
      ids.push(day[j].id); if(day[j].prio==='High')hasHigh=true; if(!day[j].isPoster)hasTimed=true;}
    if(!ids.length) continue;
    var cls=!hasTimed?'po':(hasHigh?'hi':'me'),g=pc(a,b);
    h+='<button class="rbseg '+cls+'" data-seg="'+ids.join(',')+'" data-date="'+date+'" '+
       'style="left:'+g.l+'%;width:'+g.w+'%" aria-label="'+hhmm(a)+' to '+hhmm(b)+', '+ids.length+' items"></button>';
  }
  h+='</div><div class="rblab">Tap a block for detail. Hatched = poster window.</div>'+
     '<div class="cap" id="rcap-'+date+'"></div></div>';
  return h;
}

/* ---------------- render: list ---------------- */
function renderDays(list,bands,tight){
  var byDay={},k;
  for(k=0;k<list.length;k++) (byDay[list[k].date]=byDay[list[k].date]||[]).push(list[k]);
  var tightIds={};
  for(k=0;k<tight.length;k++){tightIds[tight[k].from.id]=1;tightIds[tight[k].to.id]=1;}
  var concIds={};
  for(var d0 in bands) for(k=0;k<bands[d0].length;k++){
    var bd=bands[d0][k],day0=byDay[d0]||[];
    for(var j0=0;j0<day0.length;j0++) if(!day0[j0].isVirtual&&day0[j0].commitStart<bd.b&&day0[j0].commitEnd>bd.a)
      concIds[day0[j0].id]=1;
  }
  var h='';
  for(var di=0;di<D.dates.length;di++){
    var date=D.dates[di],day=byDay[date];
    if(!day||!day.length) continue;
    if(S.conc){var f=[];for(k=0;k<day.length;k++) if(concIds[day[k].id]) f.push(day[k]); day=f;}
    if(!day.length) continue;
    var bd2=bands[date]||[];
    h+='<section class="day" id="d-'+date+'"><h2>'+esc(DAYLAB[date]||date)+' — '+day.length+' item'+(day.length===1?'':'s')+'</h2>';
    h+=laneTimeline(date,day,bd2)+ribbon(date,day,bd2);
    var slots={},sorder=[];
    for(k=0;k<day.length;k++){
      var key=day[k].winStart+'|'+day[k].winEnd;
      if(!slots[key]){slots[key]=[];sorder.push({key:key,a:day[k].winStart,b:day[k].winEnd});}
      slots[key].push(day[k]);
    }
    sorder.sort(function(x,y){return x.a-y.a||x.b-y.b;});
    for(var si=0;si<sorder.length;si++){
      var sl=sorder[si],its=slots[sl.key];
      h+='<div class="slot"><h3>'+hhmm(sl.a)+'–'+hhmm(sl.b)+'</h3>';
      var notes=[];
      for(k=0;k<bd2.length;k++) if(bd2[k].a<sl.b&&bd2[k].b>sl.a){
        var rr=[];for(var q=0;q<bd2[k].detail.length;q++) rr.push(bd2[k].detail[q].room+' ('+bd2[k].detail[q].high+' high)');
        notes.push('Concurrent '+hhmm(bd2[k].a)+'–'+hhmm(bd2[k].b)+': '+rr.join(' · ')+' — '+(bd2[k].b-bd2[k].a)+' min');
      }
      var sqAll=computeSqueeze(day);
      for(k=0;k<sqAll.length;k++) if(sqAll[k].date===date&&sqAll[k].ws<sl.b&&sqAll[k].we>sl.a&&sqAll[k].lost>0)
        notes.push('Squeezed poster window: '+sqAll[k].surv+' of '+sqAll[k].total+' board minutes survive across '+
                   sqAll[k].boards+' boards = '+sqAll[k].per.toFixed(1)+' min per board — '+sqAll[k].lost+' min lost');
      for(k=0;k<tight.length;k++) if(tight[k].date===date&&tight[k].from.commitEnd>=sl.a&&tight[k].from.commitEnd<=sl.b)
        notes.push('Tight transition: '+tight[k].from.aid+' → '+tight[k].to.aid+' — '+tight[k].gap+' min');
      var uniq=[],seen={};
      for(k=0;k<notes.length;k++) if(!seen[notes[k]]){seen[notes[k]]=1;uniq.push(notes[k]);}
      if(uniq.length){
        h+='<details class="notebox"><summary>'+uniq.length+' scheduling note'+(uniq.length===1?'':'s')+
           '</summary><ul>';
        for(k=0;k<uniq.length;k++) h+='<li>'+esc(uniq[k])+'</li>';
        h+='</ul></details>';
      }

      var groups={},gorder=[];
      for(k=0;k<its.length;k++){
        var gk=its[k].stitle+'|'+its[k].winStart+'|'+its[k].winEnd;
        if(!groups[gk]){groups[gk]=[];gorder.push(gk);}
        groups[gk].push(its[k]);
      }
      gorder.sort(function(x,y){
        var A=groups[x][0],B=groups[y][0];
        return A.room.localeCompare(B.room,undefined,{numeric:true})||A.stitle.localeCompare(B.stitle);});
      for(var gi=0;gi<gorder.length;gi++){
        var g=groups[gorder[gi]];
        g.sort(function(a,b){return a.commitStart-b.commitStart||a.aid.localeCompare(b.aid,undefined,{numeric:true});});
        var rooms={},rl=[];
        for(k=0;k<g.length;k++) if(!rooms[g[k].room]){rooms[g[k].room]=1;rl.push(g[k].room);}
        var sidTxt=g[0].sid&&g.length? (function(){var ss={},a=[];for(k=0;k<g.length;k++){var s2=g[k].sid;if(!ss[s2]){ss[s2]=1;a.push(s2);}}return a.length===1?a[0]:'';})():'';
        h+='<div class="sess"><div class="shd"><div class="smeta">'+
           (sidTxt?esc(sidTxt)+' &middot; ':'')+esc(g[0].stype)+'</div>'+
           '<div class="stitle">'+esc(g[0].stitle)+'</div>'+
           '<div class="sroom">'+esc(rl.join(' / '))+'</div></div>';
        for(k=0;k<g.length;k++){
          var it=g[k],cls=pcls(it.prio);
          h+='<div class="item '+cls+'" id="it-'+it.id+'">'+
             '<div class="l1">'+esc(it.timeLabel)+' &middot; '+esc(it.room)+' &middot; '+esc(it.aid)+'</div>'+
             '<div class="ttl">'+esc(it.title)+'</div>'+
             '<div class="l2">'+esc(it.author||'Presenter TBC')+' &middot; '+
             (it.isIndustry?'<span class="ind">'+esc(it.affil)+'</span>':esc(it.affil))+
             ' &middot; '+esc(it.cat)+'</div>';
          var ak=keyOf(it), ao=effOwner(it), an=effNote(it);
          h+='<details class="ann"><summary>'+
             (ao?'<span class="owner">'+esc(ao)+'</span>':'Coverage')+
             (an?'<span class="notemark">Note</span>':'')+'</summary>'+
             '<div class="annbody">'+
             '<select class="ann-o" data-k="'+esc(ak)+'" aria-label="Coverage">'+ownerOptions(ao)+'</select>'+
             '<textarea class="ann-n" data-k="'+esc(ak)+'" rows="2" placeholder="Note" aria-label="Note">'+esc(an)+'</textarea>'+
             '</div></details>';
          if(ao||an) h+='<div class="annprint">'+(ao?'Coverage: '+esc(ao):'')+(ao&&an?' — ':'')+(an?esc(an):'')+'</div>';
          h+='</div>';
        }
        h+='</div>';
      }
      h+='</div>';
    }
    h+='</section>';
  }
  return h||'<div class="empty">No items match the current filters.</div>';
}

/* ---------------- render all ---------------- */
function render(){
  var list=base();
  var bands=computeBands(list), sq=computeSqueeze(list), tight=computeTight(list);
  renderPanel(bands,sq,tight,list);
  var shown=list;
  if(S.conc){
    var ok={},k,d;
    for(d in bands) for(k=0;k<bands[d].length;k++){
      var bd=bands[d][k];
      for(var j=0;j<list.length;j++) if(list[j].date===d&&!list[j].isVirtual&&
        list[j].commitStart<bd.b&&list[j].commitEnd>bd.a) ok[list[j].id]=1;
    }
    shown=[];for(k=0;k<list.length;k++) if(ok[list[k].id]) shown.push(list[k]);
  }
  document.getElementById('count').innerHTML='<b>'+shown.length+'</b> of '+D.items.length+' shown';
  document.getElementById('body').innerHTML=renderDays(list,bands,tight);
  document.getElementById('jump').style.display=(S.day==='all')?'':'none';
}

/* ---------------- events ---------------- */
document.addEventListener('click',function(e){
  var b=e.target.closest? e.target.closest('button,a') : null;
  if(!b) return;
  if(b.dataset && b.dataset.day!==undefined){
    S.day=b.dataset.day; syncGroup('day',b.dataset.day); render();
    if(S.day!=='all'&&window.scrollTo){try{window.scrollTo(0,0);}catch(_){}} return;}
  if(b.dataset && b.dataset.prio!==undefined){S.prio=b.dataset.prio;syncGroup('prio',b.dataset.prio);render();return;}
  if(b.id==='t-ind'){S.ind=!S.ind;b.setAttribute('aria-pressed',S.ind);render();return;}
  if(b.id==='t-conc'){S.conc=!S.conc;b.setAttribute('aria-pressed',S.conc);render();return;}
  if(b.classList && b.classList.contains('blk')){
    var it=IT[b.dataset.id],cap=b.closest('.tl').querySelector('.cap');
    cap.innerHTML='<b>'+esc(it.timeLabel)+' · '+esc(it.room)+' · '+esc(it.aid)+'</b><br>'+esc(it.title)+
      '<br>'+esc(it.author||'Presenter TBC')+' · '+esc(it.affil)+' · '+esc(it.cat)+' · '+esc(it.prio);
    return;}
  if(b.classList && b.classList.contains('rbseg')){
    var ids=b.dataset.seg.split(','),cap2=b.closest('.ribbon').querySelector('.cap'),s='',n=0;
    for(var k=0;k<ids.length&&k<8;k++){var x=IT[ids[k]];
      s+='<div style="margin-bottom:4px"><b>'+esc(x.timeLabel)+' · '+esc(x.room)+'</b><br>'+
         esc(x.aid)+' — '+esc(x.title)+' <i>('+esc(x.prio)+')</i></div>';n++;}
    if(ids.length>n) s+='<div>+'+(ids.length-n)+' more in this block</div>';
    cap2.innerHTML=s; return;}
},false);
document.addEventListener('change',function(e){
  var t=e.target;
  if(!t) return;
  if(t.id==='f-cov'){S.cov=t.value;render();return;}
  if(t.classList&&t.classList.contains('ann-o')){setAnn(t.dataset.k,'o',t.value);render();}
},false);
document.addEventListener('input',function(e){
  var t=e.target;
  if(t&&t.classList&&t.classList.contains('ann-n')){
    setAnn(t.dataset.k,'n',t.value.trim());
    var d=t.closest('details.ann'); if(d){
      var s=d.querySelector('summary'),nm=s.querySelector('.notemark');
      if(t.value.trim()&&!nm){var sp=document.createElement('span');sp.className='notemark';sp.textContent='Note';s.appendChild(sp);}
      else if(!t.value.trim()&&nm) nm.parentNode.removeChild(nm);
    }
  }
},false);
if(!STOK) showStoreWarn();
renderCovRow();
if(SYNC_URL){ setSync('Connecting…'); flushAll(); pullRemote(true);
  setInterval(function(){flushAll();pullRemote(false);},20000);
  window.addEventListener('online',function(){flushAll();pullRemote(false);}); }
function syncGroup(g,v){
  var els=document.querySelectorAll('[data-'+g+']');
  for(var k=0;k<els.length;k++) els[k].setAttribute('aria-pressed', els[k].dataset[g]===v);
}
var catBtn=document.getElementById('f-cat-btn'),
    catMenu=document.getElementById('f-cat-menu'),
    catLab=document.getElementById('f-cat-lab');
function catLabel(){
  var names=[],c;
  for(c in S.cats) if(S.cats[c]) names.push(c);
  S.ncat=names.length;
  catLab.textContent = S.ncat===0 ? 'All' : (S.ncat===1 ? names[0] : S.ncat+' selected');
  catBtn.setAttribute('aria-pressed', S.ncat>0);
}
function setMenu(open){
  catMenu.hidden=!open;
  catBtn.setAttribute('aria-expanded',open?'true':'false');
}
catBtn.addEventListener('click',function(e){e.stopPropagation();setMenu(catMenu.hidden);});
catMenu.addEventListener('click',function(e){e.stopPropagation();});
catMenu.addEventListener('change',function(e){
  var t=e.target; if(!t||t.type!=='checkbox') return;
  if(t.checked) S.cats[t.value]=true; else delete S.cats[t.value];
  catLabel(); render();
});
document.getElementById('cat-all').addEventListener('click',function(){
  var b=catMenu.querySelectorAll('input[type=checkbox]');
  for(var k=0;k<b.length;k++){b[k].checked=true;S.cats[b[k].value]=true;}
  catLabel(); render();
});
document.getElementById('cat-none').addEventListener('click',function(){
  var b=catMenu.querySelectorAll('input[type=checkbox]');
  for(var k=0;k<b.length;k++) b[k].checked=false;
  S.cats={}; catLabel(); render();
});
document.addEventListener('click',function(){ if(!catMenu.hidden) setMenu(false); });
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!catMenu.hidden){setMenu(false);catBtn.focus();}
});
catLabel();
document.getElementById('f-q').addEventListener('input',function(){S.q=this.value;render();});
render();
})();
</script>
